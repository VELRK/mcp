<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="260" height="52" fill="none">
  <defs>
    <linearGradient id="logoWhiteBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#132a4d"/>
    </linearGradient>
    <linearGradient id="logoWhiteBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="logoWhiteVisor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="aiWhitePillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="logoWhiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Group: Robotic Pilot Emblem (44x44 at x=2, y=4) -->
  <g transform="translate(2, 4)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="44" height="44" rx="12" fill="url(#logoWhiteBgGrad)"/>
    <rect x="0" y="0" width="44" height="44" rx="12" fill="none" stroke="url(#logoWhiteBorder)" stroke-width="2"/>

    <!-- Omnichannel Transmission Arcs (Wings) -->
    <path d="M4 18C7 18 9 20 9 22C9 24 7 26 4 26" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <path d="M40 18C37 18 35 20 35 22C35 24 37 26 40 26" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

    <!-- Helmet Base -->
    <path d="M13 18C13 12.5 17 8.5 22 8.5C27 8.5 31 12.5 31 18V27C31 31.5 27 34.5 22 34.5C17 34.5 13 31.5 13 27V18Z" fill="#182c52" stroke="#2c4c87" stroke-width="1.2"/>

    <!-- Signal Node (Antenna) -->
    <line x1="22" y1="4.5" x2="22" y2="8.5" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="22" cy="4.5" r="2" fill="#34d399" filter="url(#logoWhiteGlow)"/>

    <!-- Robotic Visor / Eyes -->
    <rect x="15" y="16.5" width="14" height="8" rx="4" fill="#061929" stroke="#34d399" stroke-width="1.2"/>
    <rect x="16.5" y="18" width="11" height="5" rx="2.5" fill="url(#logoWhiteVisor)" filter="url(#logoWhiteGlow)"/>
    
    <!-- Eyes -->
    <circle cx="19.5" cy="20.5" r="1.1" fill="#ffffff"/>
    <circle cx="24.5" cy="20.5" r="1.1" fill="#ffffff"/>

    <!-- Headset Nodes -->
    <rect x="11" y="19" width="2.2" height="7" rx="1.1" fill="#34d399"/>
    <rect x="31" y="19" width="2.2" height="7" rx="1.1" fill="#34d399"/>
  </g>

  <!-- Typography: Talk AI Pilot -->
  <g transform="translate(56, 0)">
    <!-- "Talk" Text -->
    <text x="0" y="28" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="-0.03em">Talk</text>

    <!-- "AI" Badge Pill -->
    <g transform="translate(52, 10)">
      <rect x="0" y="0" width="30" height="20" rx="6" fill="url(#aiWhitePillGrad)"/>
      <text x="15" y="14.5" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.02em">AI</text>
    </g>

    <!-- "Pilot" Text -->
    <text x="88" y="28" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="22" font-weight="900" fill="#f8fafc" letter-spacing="-0.03em">Pilot</text>

    <!-- Subtitle: Robotic Auto-Reply Engine -->
    <text x="1" y="42" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#94a3b8" letter-spacing="0.14em">ROBOTIC AUTO-REPLY</text>
  </g>
</svg>
