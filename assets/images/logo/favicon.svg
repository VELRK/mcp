<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1a"/>
      <stop offset="100%" stop-color="#0f1f38"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Pilot Wings / Omnichannel Waves (Left & Right) -->
  <path d="M7 26C11 26 14 29 14 33C14 37 11 40 7 40" fill="none" stroke="url(#wingGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M57 26C53 26 50 29 50 33C50 37 53 40 57 40" fill="none" stroke="url(#wingGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Outer Pilot Head / Helmet Structure -->
  <path d="M19 25C19 17.5 24.5 12 32 12C39.5 12 45 17.5 45 25V37C45 43.5 39.5 48 32 48C24.5 48 19 43.5 19 37V25Z" fill="#13203c" stroke="#223964" stroke-width="1.5"/>

  <!-- Top Antenna / Neural Signal Node -->
  <line x1="32" y1="7" x2="32" y2="12" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="7" r="2.5" fill="#34d399" filter="url(#glow)"/>

  <!-- Robotic Visor / AI Eyes (Glowing) -->
  <rect x="22" y="23" width="20" height="11" rx="5.5" fill="#04121d" stroke="#10b981" stroke-width="1.5"/>
  <rect x="24" y="25" width="16" height="7" rx="3.5" fill="url(#visorGrad)" filter="url(#glow)"/>
  
  <!-- Visor Reflection / Pupils -->
  <circle cx="28" cy="28.5" r="1.5" fill="#ffffff"/>
  <circle cx="36" cy="28.5" r="1.5" fill="#ffffff"/>

  <!-- Chat Speech Triangular Beacon (Subtle bottom chat arrow) -->
  <polygon points="32,49 28,45 36,45" fill="#10b981"/>

  <!-- Pilot Ear Modules / Headset Nodes -->
  <rect x="16" y="27" width="3" height="10" rx="1.5" fill="#10b981"/>
  <rect x="45" y="27" width="3" height="10" rx="1.5" fill="#10b981"/>
</svg>