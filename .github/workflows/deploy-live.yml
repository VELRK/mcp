# Deploy TalkAI Pilot shop to VPS on push to main
name: Deploy live (talkaipilot.com)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-shop-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy shop via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            /usr/local/bin/deploy-mcp-shop.sh
